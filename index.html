<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Урок 1 — English Mode Activated</title>
  <meta name="theme-color" content="#8c6fe8">
  <link rel="stylesheet" href="style.css?v=hq4">
  <link rel="stylesheet" href="hq.css?v=hq4">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="brand" id="homeBtn" aria-label="К началу">👾 <span>ENGLISH MODE</span></button>
      <div class="scenario-pill" aria-live="polite"><b id="scenarioStep">1/19</b><span id="scenarioTitle">DO NOT PRESS</span></div>
      <div class="power-pill" aria-label="English Power">
        <div class="power-copy"><b>ENGLISH POWER</b><strong id="powerText">0%</strong></div>
        <div class="power-track"><i id="powerBar"></i></div>
      </div>
      <div class="top-actions">
        <button id="missionBtn">⌂ Миссии</button>
        <button id="teacherBtn">👩‍🏫 Учителю</button>
        <button id="soundBtn" aria-pressed="true">🔊</button>
      </div>
    </header>

    <main class="viewport">
      <div class="stage-wrap">
        <section class="pack-stage active" data-slide="0" aria-label="Старт миссии">
          <img src="assets-hq/slide1.avif" alt="Старт миссии English Mode Activated">
          <button class="hotspot start-hotspot" data-action="start" aria-label="Старт миссии"></button>
          <button class="hotspot red-hotspot" data-action="red" aria-label="Нажать красную кнопку"></button>
          <button class="hotspot loading-hotspot" data-action="loading" aria-label="Активировать English Mode"></button>
          <button class="hotspot accept-hotspot" data-action="accept" aria-label="Accept"></button>
          <button class="hotspot decline-hotspot" data-action="decline" aria-label="Decline"></button>
          <div class="overlay-progress loading-overlay" id="loadingOverlay"><i></i></div>
          <div class="call-pulse" id="callPulse"></div>
        </section>

        <section class="pack-stage" data-slide="1" aria-label="Приветствие">
          <img src="assets-hq/slide2.avif" alt="Приветствие: Hello, Hello Battle, My name is">
          <button class="hotspot hello-hotspot" data-action="hello" aria-label="Boo says Hello"></button>
          <button class="hotspot battle-hotspot" data-action="battle" aria-label="Hello Battle"></button>
          <button class="hotspot name-hotspot" data-action="name" aria-label="My name is"></button>
        </section>

        <section class="pack-stage" data-slide="2" aria-label="Эмоции и ответы">
          <img src="assets-hq/slide3.avif" alt="Эмоции и ответы: Happy, Sad, Yes, No">
          <button class="hotspot happy-hotspot" data-action="happy" aria-label="Happy"></button>
          <button class="hotspot sad-hotspot" data-action="sad" aria-label="Sad"></button>
          <button class="hotspot camera-hotspot" data-action="camera" aria-label="Emoji camera"></button>
          <button class="hotspot yes-hotspot" data-action="yes" aria-label="Yes"></button>
          <button class="hotspot no-hotspot" data-action="no" aria-label="No"></button>
          <div class="camera-flash" id="cameraFlash"></div>
        </section>

        <section class="pack-stage" data-slide="3" aria-label="Волшебные команды">
          <img src="assets-hq/slide4.avif" alt="Волшебные команды: Stand up, Sit down, Jump, Dance, Freeze">
          <button class="hotspot command-hotspot stand" data-action="command" data-word="Stand up!" aria-label="Stand up"></button>
          <button class="hotspot command-hotspot sit" data-action="command" data-word="Sit down!" aria-label="Sit down"></button>
          <button class="hotspot command-hotspot jump" data-action="command" data-word="Jump!" aria-label="Jump"></button>
          <button class="hotspot command-hotspot dance" data-action="command" data-word="Dance!" aria-label="Dance"></button>
          <button class="hotspot command-hotspot freeze" data-action="command" data-word="Freeze!" aria-label="Freeze"></button>
          <button class="hotspot remote-hotspot" data-action="remote" aria-label="Magic remote"></button>
          <button class="hotspot boosays-hotspot" data-action="boosays" aria-label="Boo says"></button>
        </section>

        <section class="pack-stage hq-stage" data-slide="4" aria-label="Спасаем учителя">
          <img src="assets-hq/slide5.avif" alt="Спасаем учителя: Teacher Battery, High Five Power, Secret English Club">
          <button class="hotspot hq-teacher-error" data-action="teacher-error" aria-label="Teacher battery"></button>
          <button class="hotspot hq-charge hq-charge-hello" data-action="charge" data-word="Hello!" aria-label="Hello power"></button>
          <button class="hotspot hq-charge hq-charge-happy" data-action="charge" data-word="Happy!" aria-label="Happy power"></button>
          <button class="hotspot hq-charge hq-charge-jump" data-action="charge" data-word="Jump!" aria-label="Jump power"></button>
          <button class="hotspot hq-charge hq-charge-dance" data-action="charge" data-word="Dance!" aria-label="Dance power"></button>
          <button class="hotspot hq-charge hq-charge-five" data-action="charge" data-word="High five!" aria-label="High five power"></button>
          <button class="hotspot hq-club" data-action="club" aria-label="Secret English Club"></button>
          <span class="logic-only" id="teacherRobot">🤖</span>
          <span class="logic-only"><i id="teacherBatteryBar"></i><i id="miniBattery"></i><b id="teacherBatteryText"></b></span>
        </section>
        <section class="pack-stage hq-stage" data-slide="5" aria-label="Финал миссии">
          <img src="assets-hq/slide6.avif" alt="Финал миссии: You understand English, Official English Human, Bye-bye Boo, English Exit">
          <button class="hotspot hq-understand" data-action="next-final-command" aria-label="You understand English"></button>
          <button class="hotspot hq-award" data-action="award" aria-label="Official English Human"></button>
          <button class="hotspot hq-bye" data-action="bye" aria-label="Bye-bye Boo"></button>
          <button class="hotspot hq-highfive" data-action="highfive" aria-label="English Exit high five"></button>
          <span class="logic-only" id="byeSpeech">Bye-bye!</span>
        </section>
        <section class="resources-stage" data-slide="6" aria-label="Пак персонажей и UI">
          <div class="resource-title">ASSETS 1 · Персонажи и UI</div>
          <img src="assets-hq/assets1.avif" alt="Пак персонажей Boo и элементов интерфейса">
        </section>
        <section class="resources-stage" data-slide="7" aria-label="Пак карточек и наград">
          <div class="resource-title">ASSETS 2 · Карточки и награды</div>
          <img src="assets-hq/assets2.avif" alt="Пак карточек, кнопок и наград">
        </section>

        <div class="mission-focus" id="missionFocus" aria-hidden="true"><span id="focusLabel">НАЖМИ СЮДА</span></div>
        <div class="step-cue" id="stepCue" aria-live="polite"></div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
        <div class="confetti" id="confetti"></div>

        <dialog id="gameDialog" class="game-dialog">
          <button class="dialog-close" id="dialogClose" aria-label="Закрыть">×</button>
          <div id="dialogContent"></div>
        </dialog>
      </div>
    </main>

    <footer class="footerbar">
      <button id="prevBtn">← Назад</button>
      <div class="dots" id="dots" aria-label="Навигация по страницам"></div>
      <button id="nextBtn">Дальше →</button>
    </footer>

    <aside class="teacher-panel" id="teacherPanel" aria-hidden="true">
      <div class="teacher-head"><b>👩‍🏫 Режим учителя</b><button id="teacherClose">×</button></div>
      <div class="teacher-step" id="teacherStep"></div>
      <p id="teacherCopy">Урок идёт строго по сценарию. После выполнения задания переходите к следующей миссии.</p>
      <div class="teacher-script" id="teacherScript"></div>
      <label class="switch-row"><input type="checkbox" id="showHotspots"> <span>Показывать активные зоны</span></label>
      <button class="teacher-action secondary" id="skipStepBtn">Пропустить текущий шаг →</button>
      <button class="teacher-action" id="resourcesBtn">🎨 Открыть весь визуальный пак</button>
      <button class="teacher-action secondary" id="resetBtn">↻ Сбросить урок</button>
      <div class="teacher-note" id="teacherNote"></div>
    </aside>
  </div>
  <script src="hq-image-loader.js?v=hq4"></script>
  <script src="app.js?v=hq4"></script>
</body>
</html>
